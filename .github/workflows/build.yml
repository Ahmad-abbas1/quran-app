name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-java@v2
        with:
          java-version: 11
      - uses: subosito/flutter-action@v2
      - run: cd quran_complete_app && flutter pub get
      - run: cd quran_complete_app && flutter build apk --release
      - uses: - uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: quran_complete_app/build/app/outputs/apk/release/app-release.apk
