name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'adopt'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
      - run: cd quran_complete_app && flutter pub get
      - run: cd quran_complete_app && flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: quran_complete_app/build/app/outputs/apk/release/app-release.apk
